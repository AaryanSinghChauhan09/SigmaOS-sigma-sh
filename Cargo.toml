[package]
name = "sigmaos-sigma-sh"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SigmaOS rescue shell — minimal command interpreter for boot debugging"

[lib]
name = "sigma_sh"
path = "src/lib.rs"

[features]
default = []
sigmaos-target = []

[[bin]]
name = "sigma-sh"
path = "src/bin/sigma-sh.rs"

[[bin]]
name = "sigma-init"
path = "src/bin/sigma-init.rs"
test = false
required-features = ["sigmaos-target"]

[[bin]]
name = "ls"
path = "src/bin/ls.rs"
test = false
required-features = ["sigmaos-target"]

[[bin]]
name = "cat"
path = "src/bin/cat.rs"
test = false
required-features = ["sigmaos-target"]

[[bin]]
name = "ps"
path = "src/bin/ps.rs"
test = false
required-features = ["sigmaos-target"]

[[bin]]
name = "pkg"
path = "src/bin/pkg.rs"
test = false
required-features = ["sigmaos-target"]

[[bin]]
name = "kill"
path = "src/bin/kill.rs"
test = false
required-features = ["sigmaos-target"]

[[bin]]
name = "mount"
path = "src/bin/mount.rs"
test = false
required-features = ["sigmaos-target"]

[[bin]]
name = "sigma-child"
path = "src/bin/sigma-child.rs"
test = false
required-features = ["sigmaos-target"]

[dependencies]
sigmaos-sigma-sys = { path = "../SigmaOS-sigma-sys", features = ["x86_64"] }
